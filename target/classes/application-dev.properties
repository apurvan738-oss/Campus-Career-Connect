# ===================================================================
# Development Profile (H2 In-Memory with MySQL Dialect Compatibility)
# Allows zero-configuration immediate run & testing
# ===================================================================

spring.datasource.url=jdbc:h2:mem:placement_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at /h2-console during dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Seed Sample Data handled by DataInitializer
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
