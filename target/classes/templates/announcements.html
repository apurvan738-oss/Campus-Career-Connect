<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Notices &amp; Announcements - DRIEMS CAMPUS PLACEMENT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <span class="badge bg-primary-subtle text-primary px-3 py-1 rounded-pill fw-semibold mb-1">Official Circulars</span>
                    <h2 class="fw-bold mb-0">Placement Notice Board</h2>
                </div>
                <a th:href="@{/jobs}" class="btn btn-navy btn-sm">
                    <i class="bi bi-briefcase me-1"></i> View Open Drives
                </a>
            </div>

            <div class="row g-4" th:if="${not #lists.isEmpty(announcements)}">
                <div class="col-12" th:each="ann : ${announcements}">
                    <div class="card card-custom p-4 border shadow-sm">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <span th:class="${ann.priority.badgeClass}" th:text="${ann.priority.displayName}">HIGH</span>
                                <span class="badge bg-light text-secondary border ms-1" th:text="${'Audience: ' + ann.targetAudience}">ALL</span>
                                <h4 class="fw-bold text-dark mt-2 mb-1" th:text="${ann.title}">Announcement Title</h4>
                            </div>
                            <span class="text-muted small">
                                <i class="bi bi-calendar3 me-1"></i>
                                <span th:text="${#temporals.format(ann.publishedAt, 'dd MMM yyyy, hh:mm a')}">15 Oct 2026</span>
                            </span>
                        </div>

                        <p class="text-secondary mb-3" style="white-space: pre-line;" th:text="${ann.content}">
                            Announcement full text content...
                        </p>

                        <div class="pt-2 border-top d-flex justify-content-between align-items-center text-muted small">
                            <span><i class="bi bi-person-badge text-primary me-1"></i> Issued by: <strong th:text="${ann.authorName}">Placement Cell</strong></span>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(announcements)}" class="card card-custom p-5 text-center bg-white">
                <i class="bi bi-megaphone fs-1 text-muted"></i>
                <h5 class="text-muted mt-3">No Active Notices</h5>
                <p class="text-muted small">There are currently no active announcements published on the notice board.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
