<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - DRIEMS CAMPUS PLACEMENT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content d-flex align-items-center py-5">
        <div class="container text-center">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card card-custom border-0 shadow p-5">
                        <div class="text-warning mb-3">
                            <i class="bi bi-exclamation-octagon-fill display-1"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Something Went Wrong</h2>
                        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or processed.'}">
                            An unexpected error occurred.
                        </p>
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/}" class="btn btn-navy px-4">Go to Home</a>
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Go Back</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
