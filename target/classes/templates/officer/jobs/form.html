<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${jobDto.id == null ? 'Create Job Drive' : 'Edit Job Drive'} + ' - CampusPlace'">Job Drive Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-4">
        <div class="container-fluid px-lg-4">

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row g-4">
                <div class="col-lg-2">
                    <div th:replace="~{fragments/officer_sidebar :: officer_sidebar('jobs')}"></div>
                </div>

                <div class="col-lg-10">
                    <div class="card card-custom p-4 p-md-5 border-0 shadow-sm bg-white col-lg-9 mx-auto">
                        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                            <div>
                                <h3 class="fw-bold mb-1" th:text="${jobDto.id == null ? 'Post New Job Drive' : 'Edit Placement Drive'}">Placement Drive</h3>
                                <p class="text-muted small mb-0">Set role specifications, packages, and branch/CGPA eligibility cutoffs</p>
                            </div>
                            <a th:href="@{/officer/jobs}" class="btn btn-outline-secondary btn-sm">
                                &larr; Back to Job Drives
                            </a>
                        </div>

                        <form th:action="${jobDto.id == null} ? @{/officer/jobs/new} : @{/officer/jobs/{id}/edit(id=${jobDto.id})}"
                              th:object="${jobDto}" method="post">

                            <!-- Section 1: Basic Role Details -->
                            <h6 class="fw-bold text-primary mb-3">1. Recruiter &amp; Role Identity</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Recruiting Company <span class="text-danger">*</span></label>
                                    <select th:field="*{companyId}" class="form-select" th:classappend="${#fields.hasErrors('companyId')} ? 'is-invalid' : ''" required>
                                        <option value="">Select Company</option>
                                        <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}">Company</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('companyId')}" th:errors="*{companyId}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Job Title / Designation <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" placeholder="e.g. Software Development Engineer - I" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Employment Type <span class="text-danger">*</span></label>
                                    <select th:field="*{jobType}" class="form-select">
                                        <option value="FULL_TIME">Full Time</option>
                                        <option value="INTERNSHIP">Internship</option>
                                        <option value="INTERN_PLUS_FULLTIME">Internship + PPO</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Salary Package (LPA) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.1" th:field="*{salaryPackageLpa}" class="form-control" th:classappend="${#fields.hasErrors('salaryPackageLpa')} ? 'is-invalid' : ''" placeholder="e.g. 14.5" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('salaryPackageLpa')}" th:errors="*{salaryPackageLpa}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Job Location <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Bangalore / Remote" required>
                                </div>
                            </div>

                            <!-- Section 2: Eligibility Rules -->
                            <h6 class="fw-bold text-primary mb-3">2. Eligibility Cutoffs &amp; Constraints</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Minimum CGPA (Scale 10) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" max="10" th:field="*{minimumCgpa}" class="form-control" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Eligible Branches <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{eligibleBranches}" class="form-control" placeholder="e.g. CSE, IT, ECE or ALL" required>
                                    <span class="small text-muted">Use comma-separated codes or "ALL"</span>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Target Graduation Year</label>
                                    <input type="number" th:field="*{graduationYear}" class="form-control" placeholder="e.g. 2025 (Leave blank for any)">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Number of Vacancies</label>
                                    <input type="number" min="1" th:field="*{vacancies}" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Application Deadline <span class="text-danger">*</span></label>
                                    <input type="datetime-local" th:field="*{applicationDeadline}" class="form-control" th:classappend="${#fields.hasErrors('applicationDeadline')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('applicationDeadline')}" th:errors="*{applicationDeadline}"></div>
                                </div>
                            </div>

                            <!-- Section 3: Job Description & Selection Process -->
                            <h6 class="fw-bold text-primary mb-3">3. Job Description &amp; Process</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Job Description <span class="text-danger">*</span></label>
                                    <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Comprehensive job duties, responsibilities, and team overview..." required></textarea>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Required Technical Skills <span class="text-danger">*</span></label>
                                    <textarea th:field="*{requiredSkills}" class="form-control" rows="2" placeholder="e.g. Java 17, Spring Boot, MySQL, RESTful Web Services, DSA" required></textarea>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Selection Rounds &amp; Interview Process</label>
                                    <textarea th:field="*{selectionProcess}" class="form-control" rows="3" placeholder="e.g. Round 1: Online Coding Assessment&#10;Round 2: Technical Interview 1&#10;Round 3: HR &amp; Cultural Fit"></textarea>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Drive Status</label>
                                    <select th:field="*{status}" class="form-select">
                                        <option value="OPEN">OPEN (Accepting Applications)</option>
                                        <option value="CLOSED">CLOSED (Application window shut)</option>
                                        <option value="ARCHIVED">ARCHIVED</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/officer/jobs}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-navy px-4">
                                    <i class="bi bi-cloud-arrow-up me-1"></i> Save Job Drive
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
