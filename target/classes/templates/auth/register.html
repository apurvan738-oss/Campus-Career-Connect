<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - DRIEMS CAMPUS PLACEMENT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="text-center mb-4">
                        <div class="bg-primary text-white rounded-circle p-3 d-inline-flex mb-2">
                            <i class="bi bi-mortarboard fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Student Registration</h3>
                        <p class="text-muted">Create your placement account to access drives and track offers</p>
                    </div>

                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="card card-custom border-0 shadow p-4 p-md-5">
                        <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                            <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom">
                                <i class="bi bi-person me-2"></i> Personal &amp; Contact Details
                            </h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" placeholder="e.g. John Doe" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">College Email <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="student@college.edu" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Roll Number / Student ID <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{rollNumber}" class="form-control" th:classappend="${#fields.hasErrors('rollNumber')} ? 'is-invalid' : ''" placeholder="e.g. 2021BCSE101" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Contact Phone <span class="text-danger">*</span></label>
                                    <input type="tel" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" placeholder="10-digit mobile number" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>
                            </div>

                            <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom">
                                <i class="bi bi-mortarboard me-2"></i> Academic Information
                            </h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Branch / Stream <span class="text-danger">*</span></label>
                                    <select th:field="*{branch}" class="form-select" th:classappend="${#fields.hasErrors('branch')} ? 'is-invalid' : ''" required>
                                        <option value="">Select Branch</option>
                                        <option th:each="b : ${branches}" th:value="${b}" th:text="${b}">CSE</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('branch')}" th:errors="*{branch}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Graduation Year <span class="text-danger">*</span></label>
                                    <select th:field="*{graduationYear}" class="form-select" th:classappend="${#fields.hasErrors('graduationYear')} ? 'is-invalid' : ''" required>
                                        <option value="">Select Year</option>
                                        <option value="2025">2025</option>
                                        <option value="2026">2026</option>
                                        <option value="2027" selected>2027 (Current 2026–2027 Batch)</option>
                                        <option value="2028">2028</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('graduationYear')}" th:errors="*{graduationYear}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Current CGPA (Scale 10) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" max="10" th:field="*{cgpa}" class="form-control" th:classappend="${#fields.hasErrors('cgpa')} ? 'is-invalid' : ''" placeholder="e.g. 8.45" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cgpa')}" th:errors="*{cgpa}"></div>
                                </div>
                            </div>

                            <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom">
                                <i class="bi bi-shield-lock me-2"></i> Account Security
                            </h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Account Password <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="Min 6 characters" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" placeholder="Repeat password" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termsAgree" required>
                                <label class="form-check-label small text-muted" for="termsAgree">
                                    I certify that the academic information provided is true and conforms to the college placement code of conduct.
                                </label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-navy btn-lg fw-semibold">
                                    <i class="bi bi-person-check me-2"></i> Register Student Account
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3 pt-3 border-top">
                            <span class="text-muted small">Already registered?</span>
                            <a th:href="@{/login}" class="fw-semibold text-primary small ms-1">Sign in here</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
