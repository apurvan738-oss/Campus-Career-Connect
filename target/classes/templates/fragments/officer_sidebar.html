<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="officer_sidebar(activeTab)" class="sidebar-sticky">
    <div class="card card-custom p-3 mb-4">
        <div class="d-flex align-items-center gap-3 pb-3 mb-3 border-bottom">
            <div class="bg-primary-subtle text-primary p-2 rounded-circle">
                <i class="bi bi-shield-lock-fill fs-4"></i>
            </div>
            <div>
                <h6 class="mb-0 fw-bold">Placement Cell</h6>
                <span class="badge bg-warning text-dark small" style="font-size: 0.7rem;">OFFICER CONSOLE</span>
            </div>
        </div>

        <nav class="sidebar-nav nav flex-column">
            <a class="nav-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}" th:href="@{/officer/dashboard}">
                <i class="bi bi-speedometer2"></i> Dashboard Overview
            </a>
            <a class="nav-link" th:classappend="${activeTab == 'applications' ? 'active' : ''}" th:href="@{/officer/applications}">
                <i class="bi bi-person-lines-fill"></i> Review Applicants
            </a>
            <a class="nav-link" th:classappend="${activeTab == 'jobs' ? 'active' : ''}" th:href="@{/officer/jobs}">
                <i class="bi bi-briefcase-fill"></i> Job Drives
            </a>
            <a class="nav-link" th:classappend="${activeTab == 'companies' ? 'active' : ''}" th:href="@{/officer/companies}">
                <i class="bi bi-buildings-fill"></i> Partner Companies
            </a>
            <a class="nav-link" th:classappend="${activeTab == 'students' ? 'active' : ''}" th:href="@{/officer/students}">
                <i class="bi bi-people-fill"></i> Student Registry
            </a>
            <a class="nav-link" th:classappend="${activeTab == 'announcements' ? 'active' : ''}" th:href="@{/officer/announcements}">
                <i class="bi bi-megaphone-fill"></i> Notice Board
            </a>
            <a class="nav-link" th:classappend="${activeTab == 'reports' ? 'active' : ''}" th:href="@{/officer/reports}">
                <i class="bi bi-bar-chart-fill"></i> Reports &amp; Analytics
            </a>
            <hr class="my-2">
            <a class="nav-link text-muted" th:href="@{/jobs}" target="_blank">
                <i class="bi bi-box-arrow-up-right"></i> View Student Portal
            </a>
        </nav>
    </div>
</div>
</html>
