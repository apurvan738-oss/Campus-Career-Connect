# ===================================================================
# Student Placement Management System - Main Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:3000}
server.servlet.context-path=/

# Active Spring Profile (default: dev using H2 embedded in-memory/file with MySQL compatibility)
# Set SPRING_PROFILES_ACTIVE=mysql to activate MySQL database
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Metadata
app.name=DRIEMS CAMPUS PLACEMENT
app.version=1.0.0
app.initial-admin.email=officer@driems.ac.in
app.initial-admin.password=Admin@123
app.initial-admin.name=Head Placement Officer - DRIEMS

# File Upload Configuration (Max 5MB for Resumes)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:./uploads/resumes}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Internationalization and Encoding
spring.messages.encoding=UTF-8
