<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <!-- Outer Shield Border -->
  <defs>
    <clipPath id="shieldClip">
      <path d="M 50,30 L 450,30 C 450,30 460,340 430,410 C 390,500 250,545 250,545 C 250,545 110,500 70,410 C 40,340 50,30 50,30 Z" />
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Black Shield Contour -->
  <path d="M 40,20 L 460,20 C 460,20 475,350 442,425 C 400,518 250,555 250,555 C 250,555 100,518 58,425 C 25,350 40,20 40,20 Z" fill="#1e1e1e" filter="url(#shadow)"/>

  <!-- Inner Shield Group -->
  <g clip-path="url(#shieldClip)">
    <!-- Quadrant 1: Top-Left (Red) - Maritime Anchor -->
    <rect x="0" y="0" width="250" height="280" fill="#dc2626" />
    
    <!-- Quadrant 2: Top-Right (Sky Blue) - Engineering Gear -->
    <rect x="250" y="0" width="250" height="280" fill="#60a5fa" />
    
    <!-- Quadrant 3: Bottom-Left (Black) - Lamp of Knowledge & Book -->
    <rect x="0" y="280" width="250" height="280" fill="#18181b" />
    
    <!-- Quadrant 4: Bottom-Right (Yellow) - Caduceus Staff -->
    <rect x="250" y="280" width="250" height="280" fill="#facc15" />

    <!-- White Dividing Cross -->
    <rect x="240" y="0" width="20" height="560" fill="#ffffff" />
    <rect x="0" y="270" width="500" height="20" fill="#ffffff" />

    <!-- 1. Anchor in Top-Left (Red) -->
    <g transform="translate(145, 145) scale(0.95)" stroke="#3f1c1c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Ring at top -->
      <circle cx="0" cy="-85" r="18" fill="none" stroke="#2b1414" stroke-width="12"/>
      <!-- Vertical Shaft -->
      <line x1="0" y1="-67" x2="0" y2="70" stroke="#2b1414" stroke-width="18"/>
      <!-- Cross Bar -->
      <line x1="-55" y1="-50" x2="55" y2="-50" stroke="#2b1414" stroke-width="16"/>
      <circle cx="-55" cy="-50" r="7" fill="#2b1414"/>
      <circle cx="55" cy="-50" r="7" fill="#2b1414"/>
      <!-- Curved Arms -->
      <path d="M -75,25 C -65,85 0,95 0,95 C 0,95 65,85 75,25" stroke="#2b1414" stroke-width="18"/>
      <!-- Left Arrowhead -->
      <polygon points="-85,15 -60,25 -80,45" fill="#2b1414" stroke="none"/>
      <!-- Right Arrowhead -->
      <polygon points="85,15 60,25 80,45" fill="#2b1414" stroke="none"/>
    </g>

    <!-- 2. Industrial Cog / Gear in Top-Right (Sky Blue) -->
    <g transform="translate(365, 145) scale(0.9)">
      <!-- Outer Gear Teeth -->
      <circle cx="0" cy="0" r="82" fill="#262626"/>
      <!-- 12 Teeth -->
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(30)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(60)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(90)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(120)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(150)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(180)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(210)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(240)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(270)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(300)" fill="#262626"/>
      <path d="M -16,-98 L 16,-98 L 13,-78 L -13,-78 Z" transform="rotate(330)" fill="#262626"/>
      <!-- Metallic disc gradient inside -->
      <circle cx="0" cy="0" r="70" fill="#e5e7eb" stroke="#1f2937" stroke-width="4"/>
      <!-- Ray lines -->
      <path d="M 0,0 L -50,-50 L 0,-70 Z" fill="#9ca3af" opacity="0.6"/>
      <path d="M 0,0 L 50,-50 L 70,0 Z" fill="#d1d5db" opacity="0.8"/>
      <path d="M 0,0 L 50,50 L 0,70 Z" fill="#4b5563" opacity="0.6"/>
      <path d="M 0,0 L -50,50 L -70,0 Z" fill="#22c55e" opacity="0.8"/>
      <!-- Gear Center Hole -->
      <circle cx="0" cy="0" r="26" fill="#111827" stroke="#e5e7eb" stroke-width="4"/>
    </g>

    <!-- 3. Open Book & Diya (Flame of Knowledge) in Bottom-Left (Black) -->
    <g transform="translate(145, 410) scale(0.95)">
      <!-- Flame -->
      <path d="M 0,-85 C -18,-50 -14,-25 0,-15 C 14,-25 18,-50 0,-85 Z" fill="#fde047" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 0,-70 C -8,-45 -6,-25 0,-18 C 6,-25 8,-45 0,-70 Z" fill="#ffffff" opacity="0.8"/>
      
      <!-- Diya Clay Lamp -->
      <path d="M -32,-15 C -25,12 25,12 32,-15 C 15,-18 -15,-18 -32,-15 Z" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
      
      <!-- Open Book -->
      <g stroke="#ffffff" stroke-width="5" fill="#18181b" stroke-linecap="round" stroke-linejoin="round">
        <!-- Left Page lines -->
        <path d="M 0,15 C -35,5 -70,18 -85,25 L -85,75 C -70,68 -35,55 0,65 Z" fill="#ffffff"/>
        <!-- Right Page lines -->
        <path d="M 0,15 C 35,5 70,18 85,25 L 85,75 C 70,68 35,55 0,65 Z" fill="#ffffff"/>
        <!-- Spine Center -->
        <line x1="0" y1="15" x2="0" y2="70" stroke="#18181b" stroke-width="4"/>
        <!-- Page horizontal text lines (Left) -->
        <line x1="-20" y1="32" x2="-70" y2="38" stroke="#18181b" stroke-width="3"/>
        <line x1="-20" y1="44" x2="-70" y2="50" stroke="#18181b" stroke-width="3"/>
        <line x1="-20" y1="56" x2="-65" y2="61" stroke="#18181b" stroke-width="3"/>
        <!-- Page horizontal text lines (Right) -->
        <line x1="20" y1="32" x2="70" y2="38" stroke="#18181b" stroke-width="3"/>
        <line x1="20" y1="44" x2="70" y2="50" stroke="#18181b" stroke-width="3"/>
        <line x1="20" y1="56" x2="65" y2="61" stroke="#18181b" stroke-width="3"/>
      </g>
    </g>

    <!-- 4. Caduceus / Medical Staff in Bottom-Right (Yellow) -->
    <g transform="translate(365, 410) scale(0.95)" fill="#111827">
      <!-- Central Rod -->
      <line x1="0" y1="-85" x2="0" y2="90" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
      <circle cx="0" cy="-90" r="10" fill="#111827"/>
      <!-- Wings at top -->
      <path d="M 0,-75 C -25,-85 -55,-80 -60,-65 C -45,-60 -25,-65 -5,-70 Z" fill="#111827"/>
      <path d="M 0,-75 C 25,-85 55,-80 60,-65 C 45,-60 25,-65 5,-70 Z" fill="#111827"/>
      <path d="M -5,-68 C -25,-65 -45,-55 -48,-45 C -35,-48 -20,-55 0,-62 Z" fill="#111827"/>
      <path d="M 5,-68 C 25,-65 45,-55 48,-45 C 35,-48 20,-55 0,-62 Z" fill="#111827"/>

      <!-- Entwined Serpents (Figure 8 loops) -->
      <path d="M -22,-45 C -30,-30 0,-15 18,0 C 35,15 0,35 -20,50 C -35,60 0,75 0,85" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
      <path d="M 22,-45 C 30,-30 0,-15 -18,0 C -35,15 0,35 20,50 C 35,60 0,75 0,85" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
      <!-- Serpent Heads Facing Each Other -->
      <ellipse cx="-16" cy="-48" rx="8" ry="5" transform="rotate(35 -16 -48)"/>
      <ellipse cx="16" cy="-48" rx="8" ry="5" transform="rotate(-35 16 -48)"/>
    </g>
  </g>

  <!-- Thick Inner Shield Border Line -->
  <path d="M 50,30 L 450,30 C 450,30 460,340 430,410 C 390,500 250,545 250,545 C 250,545 110,500 70,410 C 40,340 50,30 50,30 Z" fill="none" stroke="#111827" stroke-width="16"/>
</svg>
