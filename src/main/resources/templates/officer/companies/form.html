<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${company.id == null ? 'Add Company' : 'Edit Company'} + ' - DRIEMS CAMPUS PLACEMENT'">Company Form - DRIEMS CAMPUS PLACEMENT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-4">
        <div class="container-fluid px-lg-4">

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row g-4">
                <div class="col-lg-2">
                    <div th:replace="~{fragments/officer_sidebar :: officer_sidebar('companies')}"></div>
                </div>

                <div class="col-lg-10">
                    <div class="card card-custom p-4 p-md-5 border-0 shadow-sm bg-white col-lg-8 mx-auto">
                        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                            <div>
                                <h3 class="fw-bold mb-1" th:text="${company.id == null ? 'Add Partner Company' : 'Edit Company Details'}">Company Details</h3>
                                <p class="text-muted small mb-0">Record recruiting organization information for campus placement</p>
                            </div>
                            <a th:href="@{/officer/companies}" class="btn btn-outline-secondary btn-sm">
                                &larr; Back to Directory
                            </a>
                        </div>

                        <form th:action="${company.id == null} ? @{/officer/companies/new} : @{/officer/companies/{id}/edit(id=${company.id})}"
                              th:object="${company}" method="post">

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Company Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Google India" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Industry Sector</label>
                                    <input type="text" th:field="*{industry}" class="form-control" placeholder="e.g. Information Technology / Cloud">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Company Website</label>
                                    <input type="url" th:field="*{website}" class="form-control" placeholder="https://careers.example.com">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Hiring Office / Location</label>
                                    <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Bangalore / Hyderabad">
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Company Profile / Description</label>
                                    <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Overview of company products, culture, and achievements..."></textarea>
                                </div>
                            </div>

                            <h6 class="fw-bold text-primary mb-3">Campus Placement Point of Contact (SPOC)</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Contact Person</label>
                                    <input type="text" th:field="*{contactPerson}" class="form-control" placeholder="e.g. Campus HR Lead">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Contact Email</label>
                                    <input type="email" th:field="*{contactEmail}" class="form-control" placeholder="campus-hire@example.com">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Contact Phone</label>
                                    <input type="tel" th:field="*{contactPhone}" class="form-control" placeholder="Mobile / Landline">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/officer/companies}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-navy px-4">
                                    <i class="bi bi-check2-circle me-1"></i> Save Company
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
