<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notice Board - Placement Officer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-4">
        <div class="container-fluid px-lg-4">

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row g-4">
                <div class="col-lg-2">
                    <div th:replace="~{fragments/officer_sidebar :: officer_sidebar('announcements')}"></div>
                </div>

                <div class="col-lg-10">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold mb-1">Placement Notices &amp; Circulars</h2>
                            <p class="text-muted small mb-0">Broadcast interview schedules, assessment updates, and placement cell guidelines</p>
                        </div>
                    </div>

                    <div class="row g-4">
                        <!-- Left: Form to Post New Announcement -->
                        <div class="col-lg-5">
                            <div class="card card-custom p-4 border-0 shadow-sm bg-white">
                                <h5 class="fw-bold text-dark mb-3">
                                    <i class="bi bi-megaphone-fill text-primary me-2"></i> Post New Announcement
                                </h5>

                                <form th:action="@{/officer/announcements/new}" th:object="${announcement}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold small">Title / Subject <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Google Written Round Schedule" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-semibold small">Target Student Audience</label>
                                        <input type="text" th:field="*{targetAudience}" class="form-control" placeholder="e.g. ALL, CSE, IT, 2025 BATCH">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-semibold small">Priority Level</label>
                                        <select th:field="*{priority}" class="form-select">
                                            <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.displayName}">NORMAL</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-semibold small">Notice Content / Instructions <span class="text-danger">*</span></label>
                                        <textarea th:field="*{content}" class="form-control" rows="4" placeholder="Enter full announcement details, test links, reporting venues..." required></textarea>
                                    </div>

                                    <button type="submit" class="btn btn-navy btn-sm w-100 py-2">
                                        <i class="bi bi-send me-1"></i> Publish Announcement
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- Right: List of Existing Announcements -->
                        <div class="col-lg-7">
                            <div class="card card-custom p-4 border-0 shadow-sm bg-white">
                                <h5 class="fw-bold text-dark mb-3">Existing Notices</h5>

                                <div class="list-group list-group-flush" th:if="${not #lists.isEmpty(announcements)}">
                                    <div class="list-group-item px-0 py-3 border-0 border-bottom" th:each="ann : ${announcements}">
                                        <div class="d-flex justify-content-between align-items-start mb-1">
                                            <div>
                                                <span th:class="${ann.priority.badgeClass}" th:text="${ann.priority.displayName}">HIGH</span>
                                                <span class="badge bg-light text-dark border ms-1" th:text="${'Audience: ' + ann.targetAudience}">ALL</span>
                                                <h6 class="fw-bold text-dark mt-2 mb-1" th:text="${ann.title}">Title</h6>
                                            </div>
                                            <span class="text-muted small" th:text="${#temporals.format(ann.publishedAt, 'dd MMM yyyy')}">Date</span>
                                        </div>

                                        <p class="small text-secondary mb-2" style="white-space: pre-line;" th:text="${ann.content}">Content</p>

                                        <div class="d-flex justify-content-between align-items-center pt-2">
                                            <span class="small text-muted">
                                                Status:
                                                <strong th:class="${ann.active ? 'text-success' : 'text-danger'}" th:text="${ann.active ? 'Visible' : 'Hidden'}">Active</strong>
                                            </span>
                                            <div class="d-flex gap-1">
                                                <form th:action="@{/officer/announcements/{id}/toggle(id=${ann.id})}" method="post" class="d-inline">
                                                    <button type="submit" class="btn btn-sm btn-outline-warning py-0 px-2" th:title="${ann.active ? 'Hide from students' : 'Make visible'}">
                                                        <i class="bi" th:classappend="${ann.active ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                                    </button>
                                                </form>
                                                <form th:action="@{/officer/announcements/{id}/delete(id=${ann.id})}" method="post" class="d-inline"
                                                      onsubmit="return confirm('Delete this announcement permanently?');">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-2" title="Delete">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div th:if="${#lists.isEmpty(announcements)}" class="text-center py-4 text-muted small">
                                    No announcements posted yet.
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
