<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DRIEMS CAMPUS PLACEMENT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">

                    <div class="text-center mb-4">
                        <img th:src="@{/images/driems-logo.svg}" alt="DRIEMS Crest" style="height: 72px; width: auto;" class="bg-white p-2 rounded shadow-sm mb-3">
                        <h3 class="fw-bold text-dark">DRIEMS Portal Sign In</h3>
                        <p class="text-muted small">Campus Placement System - DRIEMS</p>

                    </div>

                    <!-- Alerts Fragment -->
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="card card-custom border-0 shadow p-4 mb-4">
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">College / Official Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="email" name="email" class="form-control" placeholder="user@driems.ac.in" required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-navy py-2 fw-semibold">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3 pt-3 border-top">
                            <span class="text-muted small">New DRIEMS student?</span>
                            <a th:href="@{/register}" class="fw-semibold text-primary small ms-1">Register Student Account</a>
                        </div>
                    </div>

                    <!-- Evaluation & Viva Demo Accounts Card -->
                    <div class="card border border-info-subtle bg-info-subtle text-dark p-3 rounded-3 shadow-sm">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <i class="bi bi-info-circle-fill text-primary"></i>
                            <strong class="small text-uppercase">Demo &amp; Viva Accounts</strong>
                        </div>
                        <div class="row g-2 small">
                            <div class="col-12 col-sm-6">
                                <div class="p-2 bg-white rounded border">
                                    <div class="fw-bold text-primary">Placement Officer</div>
                                    <div class="text-muted font-monospace" style="font-size: 0.72rem;">officer@driems.ac.in</div>
                                    <div class="text-muted font-monospace" style="font-size: 0.72rem;">Password: Admin@123</div>
                                    <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2 mt-1"
                                            onclick="document.getElementById('email').value='officer@driems.ac.in';document.getElementById('password').value='Admin@123';">
                                        Fill Credentials
                                    </button>
                                </div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <div class="p-2 bg-white rounded border">
                                    <div class="fw-bold text-success">Student (Rahul, CSE)</div>
                                    <div class="text-muted font-monospace" style="font-size: 0.72rem;">rahul.cse@college.edu</div>
                                    <div class="text-muted font-monospace" style="font-size: 0.72rem;">Password: Student@123</div>
                                    <button type="button" class="btn btn-sm btn-outline-success py-0 px-2 mt-1"
                                            onclick="document.getElementById('email').value='rahul.cse@college.edu';document.getElementById('password').value='Student@123';">
                                        Fill Credentials
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
